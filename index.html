<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adtima · Employee of the Quarter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F2F8FE;--royal:#1D40D0;--royalD:#1534B8;--cyan:#0FA3E0;--light:#E3F1FD;--border:#D6E7F8;--yellow:#F4C20D;--ink:#13204A;--muted:#55657F;--okBg:#DDF4EC;--okInk:#0B6B53;--waitBg:#FDF1D3;--waitInk:#7A5208;--offBg:#ECEFF4;--offInk:#4A566C;--goldBg:#FFF3C4;--goldInk:#6B5200;--inB:#C9DDF2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.55}
a{color:var(--royal)}a:hover{color:var(--royalD)}
h1,h2,h3{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.demo{background:var(--goldBg);color:var(--goldInk);font-size:13px}
.demo .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:44px;padding-top:6px;padding-bottom:6px}
.demo select,.demo button{font:inherit;font-size:13px;min-height:32px;border-radius:8px;border:1px solid #E5CF7A;background:#fff;color:var(--goldInk);padding:0 10px;cursor:pointer}
.top{background:#fff;border-bottom:1px solid #DCEBFA;position:sticky;top:0;z-index:5}
.topin{display:flex;align-items:center;gap:24px;flex-wrap:wrap;min-height:72px;padding-top:8px;padding-bottom:8px}
.logo{display:flex;flex-direction:column;line-height:1;text-decoration:none}
.lw{font-weight:800;font-size:28px;letter-spacing:-.5px;color:var(--royal)}.lw b{color:var(--cyan);font-weight:800}
.tg{font-size:10px;letter-spacing:1.6px;color:var(--ink);margin-top:4px}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;color:#3D4D6E;text-decoration:none;font-weight:600}
.nav a.on{background:var(--light);color:var(--royalD)}
.who{display:flex;align-items:center;gap:12px}
.who .n{text-align:right;line-height:1.3}.who .n b{display:block}.who .n span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;background:var(--royal);color:#fff;font-weight:700;text-decoration:none;border:0;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--royalD);color:#fff}
.btn2{background:#fff;color:var(--royal);border:1px solid #B9D5F2}.btn2:hover{background:var(--light);color:var(--royalD)}
.btn:disabled{background:#B8C4DE;color:#fff;cursor:not-allowed;border-color:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.link{background:none;border:0;color:var(--royal);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
main{padding:32px 0 8px}
.stack{display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px}
.sec{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--royal);margin:0}
.sec:before{content:"";width:6px;height:16px;border-radius:3px;background:var(--royal);flex:none}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1 1 220px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px;border-radius:13px;font-size:12px;font-weight:600;background:var(--light);color:var(--royalD);white-space:nowrap;border:0;font-family:inherit}
button.chip{cursor:pointer;min-height:32px}
.chip.ok{background:var(--okBg);color:var(--okInk)}.chip.wait{background:var(--waitBg);color:var(--waitInk)}.chip.off{background:var(--offBg);color:var(--offInk)}.chip.gold{background:var(--goldBg);color:var(--goldInk)}
.muted{color:var(--muted)}.small{font-size:13px}.pre{white-space:pre-line}
label.lbl,.lbl{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.in{width:100%;min-height:44px;border:1px solid var(--inB);border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.in:focus{outline:2px solid var(--cyan);outline-offset:1px}
.in[readonly]{background:var(--bg);color:#3D4D6E}
textarea.in{resize:vertical;min-height:110px}
.cnt{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.hero{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:32px}
.hero h1{font-size:clamp(28px,4vw,40px);font-weight:800;color:var(--royal);line-height:1.15;margin:10px 0 6px}
.prize{background:var(--royal);color:#fff;border-radius:14px;padding:20px 30px;text-align:center}
.prize b{display:block;font-size:28px;font-weight:800}.prize span{font-size:12px;letter-spacing:1px}
.dates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dates div{background:var(--light);color:var(--royalD);border-radius:10px;padding:14px 12px;text-align:center}
.dates b{display:block;font-size:16px;font-weight:800}.dates span{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}.dates em{display:block;font-style:normal;font-size:12px;font-weight:500}
.dates .now{background:var(--cyan);color:var(--ink)}.dates .end{background:var(--royal);color:#fff}
.crit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.crit>div{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.crit h3{background:var(--light);color:var(--royal);font-size:12px;font-weight:800;padding:12px 16px;display:flex;justify-content:space-between;gap:8px}
.crit h3 span{font-size:15px}.crit p{margin:0;padding:12px 16px;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cand{display:flex;flex-direction:column;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--light);color:var(--royalD);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.ch{display:flex;gap:14px;align-items:center}.ch h3{font-size:17px}
.lab{font-size:12px;font-weight:700;color:var(--royal);letter-spacing:1px;text-transform:uppercase}
.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tbl{background:#fff;border:1px solid var(--border);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;font-weight:700;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-top:1px solid #E6F0FA;vertical-align:middle}
tr.hl td{background:var(--goldBg)}tr.sel td{background:var(--light)}tr.warn td{background:#FFF8E8}
.banner{display:flex;gap:14px;align-items:center;background:var(--light);border-radius:12px;padding:14px 18px;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:220px}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--royal);line-height:1.3}.stat small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.bar{height:10px;background:var(--light);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--royal);border-radius:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.vote{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
.citem{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:56px}
.citem.on{background:var(--light);border-color:var(--light)}.citem:disabled{cursor:not-allowed;color:var(--muted)}
.cb{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--inB);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:13px;background:#fff}
.on .cb{background:var(--royal);border-color:var(--royal);color:#fff}.citem:disabled .cb{background:var(--offBg);border-color:var(--offBg);color:var(--offInk)}
.crow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.crow>div:first-child{flex:1;min-width:180px}
.seg{display:flex;gap:6px}.seg button{width:44px;height:44px;border-radius:8px;border:1px solid var(--inB);background:#fff;font:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--royal);border-color:var(--royal);color:#fff}
.score{background:var(--light);border-radius:10px;padding:8px 14px;text-align:center}.score small{display:block;font-size:11px;font-weight:700;color:var(--royalD);letter-spacing:1px}.score b{font-size:20px;font-weight:800;color:var(--royal)}
.modalbg{position:fixed;inset:0;background:rgba(19,32,74,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:#fff;border-radius:16px;padding:28px;max-width:620px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.icon{width:48px;height:48px;border-radius:50%;background:var(--waitBg);color:var(--waitInk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--royal)}
.sw{display:flex;gap:14px;align-items:flex-start;cursor:pointer}.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{flex:none;width:46px;height:26px;border-radius:13px;background:var(--offBg);position:relative;transition:.15s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sw input:checked+i{background:var(--royal)}.sw input:checked+i:after{left:23px}.sw input:focus-visible+i{outline:2px solid var(--cyan);outline-offset:2px}
.err{background:var(--waitBg);color:var(--waitInk);border-radius:10px;padding:10px 14px;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;z-index:30;font-weight:600;max-width:90vw}
.empty{text-align:center;padding:40px 24px;color:var(--muted)}
.foot{border-top:3px solid var(--yellow);margin-top:48px;padding:16px 0 32px;font-size:12px;letter-spacing:1px;color:var(--muted);text-align:right}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:1px}
@media (max-width:900px){.two,.vote{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.crit,.dates{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<style>
.vleft{display:flex;flex-direction:column;gap:16px;align-self:stretch}.vdef{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:20px}.vdef .small{font-size:12.5px;line-height:1.45}
.vdef .tbl table{min-width:0}.vdef td,.vdef th{padding:8px 10px}
.imp{display:flex;flex-direction:column;gap:14px}
.segr{display:flex;gap:6px;flex-wrap:wrap}.segr label{position:relative}.segr input{position:absolute;opacity:0;width:1px;height:1px}.segr span{display:flex;width:44px;height:44px;border-radius:8px;border:1px solid var(--inB);background:#fff;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer}.segr input:checked+span{background:var(--royal);border-color:var(--royal);color:#fff}.segr input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:2px}
.part{font-size:16px;font-weight:800;color:var(--ink);margin:6px 0 0;padding-top:8px;border-top:1px solid var(--border)}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:880px;margin:0 auto;width:100%}
.role{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;font:inherit;color:inherit;cursor:pointer;text-decoration:none;min-height:180px}
.role:hover{border-color:var(--royal);color:inherit}.role h2{font-size:20px;font-weight:800;color:var(--royal)}.role .go{margin-top:auto;font-weight:700;color:var(--royal)}
.ev{border-left:0;background:var(--bg);border-radius:10px;padding:10px 14px}.ev b{display:flex;justify-content:space-between;gap:8px;color:var(--royal);font-size:13px}
.deft td,.deft th{vertical-align:top}.deft td:first-child{font-weight:800;color:var(--royal);width:56px}
.lvl{font-size:12px;color:var(--muted);margin-top:4px}
.match{font-size:13px;margin-top:6px}
@media (max-width:700px){.roles{grid-template-columns:1fr}}
</style>
<div id="demo"></div>
<header class="top"><div class="wrap topin" id="top"></div></header>
<main class="wrap" id="app" aria-live="polite"><p class="muted">Đang tải…</p></main>

<script>
(function(){
'use strict';
var API = window.EOQ_API_URL || '';
var DEMO = !API || /[?&]demo\b/.test(location.search);
var S = { peek: {}, imp: null, sess: load(), pub: null, home: null, ballot: null, admin: null, q: '', team: 'all', sel: [], scores: {}, notes: {}, nomFilter: 'approved', selNom: null, editNom: false };
var RK = { ev1:'r1', ev2:'r2', ev3:'r3', ev4:'r4' };
var CRIT = [['c1','ev1','Performance & Delivery',35,'Hoàn thành tốt hoặc vượt KPI, mục tiêu và cam kết công việc trong quý; đảm bảo chất lượng, tiến độ và hiệu quả thực thi.'],['c2','ev2','Impact & Contribution',30,'Tạo giá trị cụ thể cho team, khách hàng hoặc tổ chức: tăng hiệu quả kinh doanh, cải thiện dịch vụ, tối ưu quy trình hoặc tiết kiệm nguồn lực.'],['c3','ev3','Ownership & Proactiveness',20,'Chủ động nhận trách nhiệm, giải quyết vấn đề, phối hợp và hỗ trợ đồng đội; tích cực tham gia hoạt động chung, chia sẻ kiến thức.'],['c4','ev4','Improvement & Innovation',15,'Đề xuất và áp dụng cải tiến, cách làm mới hoặc công nghệ mới; tích cực ứng dụng AI. Ghi nhận cải tiến nhỏ có hiệu quả thực tế.']];
var SCALE = [['Chưa đáp ứng kỳ vọng','Không đáp ứng yêu cầu cơ bản của tiêu chí. Kết quả hoặc hành vi còn hạn chế, chưa có minh chứng rõ ràng về đóng góp.'],['Đáp ứng một phần kỳ vọng','Đáp ứng một phần yêu cầu nhưng chưa ổn định; mức độ đóng góp còn hạn chế, cần được hỗ trợ hoặc cải thiện thêm.'],['Đáp ứng kỳ vọng','Hoàn thành tốt trách nhiệm và yêu cầu công việc; có những đóng góp phù hợp với phạm vi và kỳ vọng của vị trí.'],['Vượt kỳ vọng','Có đóng góp nổi bật vượt ngoài yêu cầu thông thường; thể hiện sự chủ động và tạo ra giá trị tích cực, rõ ràng cho team hoặc tổ chức.'],['Xuất sắc','Có đóng góp đặc biệt nổi bật trong quý; tạo ra tác động thực tế vượt trội so với kỳ vọng của vị trí, có minh chứng rõ ràng và mang lại giá trị đáng kể cho tổ chức.']];
var PHASE = { upcoming:'Sắp mở đề cử', nomination:'Đang mở đề cử', review:'Chờ mở chấm điểm', voting:'Đang chấm điểm', closed:'Đã đóng chấm điểm' };
var STATUS = { pending:['ok','Đang hiển thị'], approved:['ok','Đang hiển thị'], hidden:['wait','HR đã ẩn'], withdrawn:['off','Đã rút'] };
var ROLE = { admin:'Admin', leader:'Team Leader', subleader:'Sales Sub-team Leader' };

function load(){ try { return JSON.parse(sessionStorage.getItem('eoq_sess2')); } catch(e){ return null; } }
function save(s){ S.sess = s; try { s ? sessionStorage.setItem('eoq_sess2', JSON.stringify(s)) : sessionStorage.removeItem('eoq_sess2'); } catch(e){} }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(n){ var p = String(n||'').trim().split(/\s+/); return esc(((p.length > 1 ? p[p.length-2][0] : '') + (p[p.length-1]||'?')[0]).toUpperCase()); }
function chip(cls, t){ return '<span class="chip ' + (cls||'') + '">' + esc(t) + '</span>'; }
function stChip(s){ var x = STATUS[s] || ['off', s]; return chip(x[0], x[1]); }
function score(v){ return Math.round(CRIT.reduce(function(a,c){ return a + (Number(v[c[0]])||0)/5*c[3]; }, 0)*10)/10; }
function fmtTime(s){ var d = new Date(s); if (isNaN(d)) return esc(s); return d.toLocaleString('vi-VN', { timeZone:'Asia/Ho_Chi_Minh', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }
function toast(m){ document.querySelectorAll('.toast').forEach(function(t){ t.remove(); }); var el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); el.textContent = m; document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 3200); }
function evBlocks(c, noRating){ return CRIT.map(function(k){ var r = noRating ? 0 : (Number(c[RK[k[1]]]) || 0); return '<div class="ev"><b><span>' + k[2] + '</span><span>' + k[3] + '%</span></b>' + (r ? '<div style="margin:4px 0">' + chip('', 'Leader đề cử tự đánh giá: ' + r + ' · ' + SCALE[r-1][0]) + '</div>' : '') + '<div class="pre">' + esc(c[k[1]]) + '</div></div>'; }).join(''); }
function defTable(){ return '<div class="tbl"><table class="deft" style="min-width:0"><thead><tr><th>Điểm</th><th>Mức đánh giá</th><th>Định nghĩa</th></tr></thead><tbody>' + SCALE.map(function(s, i){ return '<tr><td>' + (i+1) + '</td><td><b>' + s[0] + '</b></td><td class="small">' + s[1] + '</td></tr>'; }).join('') + '</tbody></table></div>'; }

var demoReady = null;
function ensureDemo(){
  if (window.MockAPI) return Promise.resolve();
  if (!demoReady) demoReady = new Promise(function(res, rej){ var s = document.createElement('script'); s.src = 'demo.js'; s.onload = res; s.onerror = function(){ rej(new Error('Không tải được demo.js')); }; document.head.appendChild(s); });
  return demoReady;
}
function api(action, extra, auth){
  var req = Object.assign({ action: action }, extra || {});
  if (auth && S.sess) { req.domain = S.sess.domain; req.code = S.sess.code; if (S.includeSelf) req.includeSelf = true; }
  var p = DEMO ? ensureDemo().then(function(){ return MockAPI.call(req); })
               : fetch(API, { method:'POST', body: JSON.stringify(req) }).then(function(r){ return r.json(); });
  return p.then(function(res){ if (!res.ok) throw new Error(res.error || 'Có lỗi xảy ra.'); return res.data; });
}

/* ---------- Layout ---------- */
function route(){ return (location.hash || '#/').slice(1); }
function go(h){ if (location.hash === h) render(); else location.hash = h; }

function renderDemo(){
  var el = document.getElementById('demo');
  if (!DEMO) { el.innerHTML = ''; return; }
  var now = ''; try { now = localStorage.getItem('eoq_demo_now') || ''; } catch(e){}
  var opts = [['','Giờ thật'],['2026-11-11T03:00:00Z','11/11 – đang đề cử'],['2026-11-14T03:00:00Z','14/11 – đang chấm'],['2026-11-18T03:00:00Z','18/11 – đã đóng']];
  el.innerHTML = '<div class="demo"><div class="wrap"><b>CHẾ ĐỘ DEMO</b><span>Dữ liệu minh hoạ. Domain / mã: hr.admin / Q7MX4KTB · binhnv / R2HV9PDN (TL Planner) · cucntt / W8KZ3MFA (Sales sub-TL) · dunglh / T5NB7QYC (TL Marketing)</span>' +
    '<label>Giả lập thời gian <select data-change="demoNow" aria-label="Giả lập thời gian">' + opts.map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === now ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' +

  logout: function(){ save(null); S.home = S.ballot = S.admin = null; S.sel = []; S.scores = {}; S.notes = {}; go('#/'); },
  demoReset: function(){ ensureDemo().then(function(){ MockAPI.reset(false); save(null); S.sel = []; S.scores = {}; S.notes = {}; toast('Đã reset: chưa có đề cử nào.'); go('#/'); }); },
  demoSample: function(){ ensureDemo().then(function(){ MockAPI.reset(true); save(null); S.sel = []; S.scores = {}; S.notes = {}; toast('Đã nạp 6 đề cử và vài phiếu chấm mẫu.'); go('#/'); }); },
  team: function(el){ S.team = el.dataset.v; refresh(); },
  withdraw: function(el){ if (!confirm('Rút đề cử này? Lượt quota sẽ được trả lại.')) return; busy(el, true); api('withdrawNomination', { id: el.dataset.id }, true).then(function(d){ S.home = d; refresh(); toast('Đã rút đề cử.'); }).catch(function(e){ busy(el, false); toast(e.message); }); },
  pick: function(el){ var id = el.dataset.id, i = S.sel.indexOf(id); if (i >= 0) S.sel.splice(i, 1); else if (S.sel.length < 2) S.sel.push(id); refresh(); },
  rate: function(el){ var id = el.dataset.id; S.scores[id] = S.scores[id] || {}; S.scores[id][el.dataset.k] = Number(el.dataset.n); var y = window.scrollY; refresh(); window.scrollTo(0, y); var b = document.querySelector('[data-act="rate"][data-id="' + CSS.escape(id) + '"][data-k="' + el.dataset.k + '"][data-n="' + el.dataset.n + '"]'); if (b) b.focus({ preventScroll:true }); },
  reviewVote: confirmVote,
  closeModal: closeModal,
  sendVote: function(el){ busy(el, true); var entries = S.sel.map(function(id){ return Object.assign({ nominationId: id, comment: S.notes[id] }, S.scores[id]); });
    api('submitVote', { entries: entries }, true).then(function(d){ S.ballot = d; S.sel = []; S.scores = {}; S.notes = {}; closeModal(); refresh(); window.scrollTo(0, 0); var lf = 2 - d.myVotes.length; toast(lf > 0 ? 'Đã gửi phiếu. Bạn còn ' + lf + ' lượt chấm.' : 'Đã gửi phiếu. Bạn đã dùng hết 2 lượt chấm.'); }).catch(function(e){ busy(el, false); showErr('merr', e.message); }); },
  nomFilter: function(el){ S.nomFilter = el.dataset.v; S.selNom = null; S.editNom = false; refresh(); },
  selNom: function(el){ S.selNom = el.dataset.id; S.editNom = false; refresh(); },
  startEdit: function(){ S.editNom = true; refresh(); },
  cancelEdit: function(){ S.editNom = false; refresh(); },
  review: function(el){ var st = el.dataset.s; var note = (document.getElementById('hrnote') || {}).value;
    if (st === 'hidden' && !String(note || '').trim()) { toast('Nhập ghi chú để leader biết lý do ẩn.'); var t = document.getElementById('hrnote'); if (t) t.focus(); return; }
    busy(el, true); api('adminReview', { id: S.selNom, status: st, note: note }, true).then(function(d){ S.admin = d; refresh(); toast(st === 'approved' ? 'Đã hiện lại đề cử.' : 'Đã ẩn đề cử.'); }).catch(function(e){ busy(el, false); toast(e.message); }); },
  exportVotes: function(){ var d = S.admin; csv('phieu-cham-' + d.cycle.cycleName.replace(/\W+/g, '-') + '.csv', [['Giám khảo','Domain','Team giám khảo','Ứng viên','Team ứng viên','Performance','Impact','Ownership','Innovation','Tổng /100','Lý do','Gửi lúc']].concat(d.votes.map(function(v){ return [v.voterName, v.voterDomain, v.voterUnit, v.candidateName, v.candidateUnit, v.c1, v.c2, v.c3, v.c4, v.total, v.comment, fmtTime(v.createdAt)]; }))); },
  exportUsers: function(){ csv('leader-ma-dang-nhap.csv', [['Họ tên','Domain','Vai trò','Team','Mã đăng nhập']].concat(S.admin.users.map(function(u){ return [u.name, u.domain, ROLE[u.role] || u.role, u.unit, u.accessCode]; }))); },
  peek: function(el){ S.peek[el.dataset.id] = !S.peek[el.dataset.id]; refresh(); },
  voteFor: function(el){ var id = el.dataset.id; if (S.sel.indexOf(id) < 0) { if (S.sel.length >= 2 - (S.ballot ? S.ballot.myVotes.length : 0)) { toast('Bạn đã chọn đủ 2 ứng viên. Bỏ chọn một người ở trang Chấm điểm để đổi.'); go('#/cham-diem'); return; } S.sel.push(id); } go('#/cham-diem'); },
  editEmp: function(el){ S.editEmp = el.dataset.id; refresh(); },
  cancelEmp: function(){ S.editEmp = null; refresh(); },
  empAll: function(){ S.empAll = true; refresh(); },
  delNom: function(el){ var n = S.admin.nominations.filter(function(x){ return x.id === S.selNom; })[0]; if (!n || !confirm('Xoá đề cử ' + n.candidateName + '? Lượt quota được trả lại cho team; phiếu chấm cho người này sẽ không còn được tính.')) return;
    busy(el, true); api('adminDelete', { id: S.selNom }, true).then(function(d){ S.admin = d; S.selNom = null; refresh(); toast('Đã xoá đề cử ' + n.candidateName + '.'); }).catch(function(e){ busy(el, false); toast(e.message); }); },
  empTeamToggle: function(el){ S.empOpen = S.empOpen || {}; S.empOpen[el.dataset.id] = !S.empOpen[el.dataset.id]; refresh(); },
  empOpenAll: function(el){ S.empOpen = {}; if (el.dataset.v === '1') S.admin.employees.forEach(function(e){ S.empOpen[e.unit] = true; }); refresh(); },
  toggleRank: function(el){ S.openRank = S.openRank || {}; S.openRank[el.dataset.id] = !S.openRank[el.dataset.id]; refresh(); },
  doImport: function(el){ var p = S.imp; if (!p || !p.rows.length) { toast('Chưa có dữ liệu để import.'); return; } if (p.errs.length) { toast('Sửa ' + p.errs.length + ' lỗi trước khi import.'); return; }
    var mode = (document.querySelector('input[name=impmode]:checked') || {}).value || 'replace';
    if (mode === 'replace' && !confirm('Thay toàn bộ danh sách hiện tại (' + S.admin.employeeCount + ' người) bằng ' + p.rows.length + ' người mới?')) return;
    var me = S.sess.domain; if (mode === 'replace' && !p.rows.some(function(r){ return r.domain === me && ROLE_IN(r.role) === 'admin'; })) { toast('Danh sách mới phải có domain của bạn (' + me + ') với vai trò Admin, nếu không bạn sẽ mất quyền đăng nhập.'); return; }
    busy(el, true); api('adminImport', { rows: p.rows, mode: mode }, true).then(function(d){ S.admin = d; S.imp = null; refresh(); toast('Đã import ' + d.importSummary.total + ' người, tạo ' + d.importSummary.created + ' mã đăng nhập mới.'); }).catch(function(e){ busy(el, false); toast(e.message); }); },
  copy: function(el){ (navigator.clipboard ? navigator.clipboard.writeText(el.dataset.v) : Promise.reject()).then(function(){ toast('Đã copy mã.'); }, function(){ toast('Không copy được, hãy bôi đen và copy thủ công.'); }); }
};
document.addEventListener('click', function(e){ var el = e.target.closest('[data-act]'); if (!el || el.disabled) return; e.preventDefault(); ACT[el.dataset.act](el); });
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.dataset.input === 'q') { S.q = el.value; var pos = el.selectionStart; refresh(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); }
  if (el.dataset.input === 'empq') { S.empQ = el.value; var ps = el.selectionStart; refresh(); var ne = document.getElementById('empq'); ne.focus(); ne.setSelectionRange(ps, ps); }
  if (el.dataset.input === 'note') S.notes[el.dataset.id] = el.value;
  if (el.dataset.input === 'imp') { S.imp = parseImport(el.value, false); document.getElementById('imppv').innerHTML = importPreview(); }
  if (el.dataset.input === 'cand') { var v = el.value.trim().toLowerCase().replace(/@.*$/, ''); var m = S.home.members.filter(function(x){ return x.domain === v; })[0]; var box = document.getElementById('cmatch');
    box.innerHTML = !v ? '<span class="muted">Họ tên và title sẽ tự hiện theo danh sách nhân viên của HR.</span>' : m ? chip('ok', '✓ ' + m.name + ' · ' + m.title) : '<span style="color:var(--waitInk)">Không thấy domain này trong team ' + esc(S.home.team.unit) + '.</span>'; }
  if (el.dataset.count) { var c = document.getElementById(el.id + '-c'); if (c) c.textContent = el.value.length.toLocaleString('vi-VN') + ' / ' + Number(el.dataset.count).toLocaleString('vi-VN') + ' ký tự'; }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.dataset.change === 'impfile' && el.files[0]) { readImportFile(el.files[0]); }
  if (el.dataset.change === 'empTeam') { S.empTeam = el.value; refresh(); }
  if (el.dataset.change === 'rlev') { var n = Number(el.value), dd = document.getElementById(el.dataset.k + '-d'); if (dd) dd.innerHTML = '<b style="color:var(--ink)">' + n + ' · ' + SCALE[n-1][0] + '</b><br>' + SCALE[n-1][1]; }
  if (el.dataset.change === 'incSelf') { S.includeSelf = el.checked; el.disabled = true; loadAdmin().then(refresh).catch(function(e){ toast(e.message); }); }
  if (el.dataset.change === 'ack') document.getElementById('sendVote').disabled = !el.checked;
  if (el.dataset.change === 'demoNow') ensureDemo().then(function(){ MockAPI.setNow(el.value); location.reload(); });
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && document.querySelector('.modalbg')) closeModal(); });
document.addEventListener('submit', function(e){
  var form = e.target, kind = form.dataset.submit; if (!kind) return; e.preventDefault();
  var fd = {}; new FormData(form).forEach(function(v, k){ fd[k] = String(v).trim(); });
  var btn = form.querySelector('[type=submit]');
  if (kind === 'login') {
    if (!fd.domain || !fd.code) return showErr('lerr', 'Vui lòng nhập domain và mã đăng nhập.');
    busy(btn, true); showErr('lerr', '');
    api('login', { domain: fd.domain, code: fd.code }).then(function(d){ save({ domain: d.me.domain, code: fd.code, user: d.me }); if (d.me.role === 'leader') S.home = d; go(d.me.role === 'admin' ? '#/admin' : '#/de-cu'); })
      .catch(function(err){ busy(btn, false); showErr('lerr', err.message); });
  }
  if (kind === 'nominate') {
    var need = [['candidateDomain','Domain người được đề cử'],['sow','SOW']].concat(CRIT.map(function(k){ return [RK[k[1]], 'Mức đánh giá ' + k[2]]; })).concat(CRIT.map(function(k){ return [k[1], 'Minh chứng ' + k[2]]; }));
    var miss = need.filter(function(x){ return !fd[x[0]]; });
    if (miss.length) { showErr('ferr', 'Vui lòng nhập: ' + miss.map(function(x){ return x[1]; }).join(', ') + '.'); var fe = document.getElementById(miss[0][0]) || form.querySelector('[name=' + miss[0][0] + ']'); if (fe) fe.focus(); return; }
    busy(btn, true); showErr('ferr', '');
    api('submitNomination', { data: fd }, true).then(function(d){ S.home = d; toast('Đã gửi đề cử. Đề cử đang hiển thị trên trang ứng viên.'); go('#/de-cu'); }).catch(function(err){ busy(btn, false); showErr('ferr', err.message); });
  }
  if (kind === 'editEmp') {
    fd.active = !!form.querySelector('[name=active]').checked;
    if (!fd.domain || !fd.name || !fd.unit) { toast('Domain, họ tên và team không được trống.'); return; }
    busy(btn, true); api('adminUpdateEmployee', { domainKey: form.dataset.key, data: fd }, true).then(function(d){ S.admin = d; S.editEmp = null; refresh(); toast('Đã lưu thông tin ' + fd.name + '.'); }).catch(function(err){ busy(btn, false); toast(err.message); });
  }
  if (kind === 'editNom') {
    busy(btn, true); api('adminEdit', { id: S.selNom, data: fd }, true).then(function(d){ S.admin = d; S.editNom = false; refresh(); toast('Đã lưu nội dung.'); }).catch(function(err){ busy(btn, false); toast(err.message); });
  }
});
window.addEventListener('hashchange', function(){ closeModal(); S.editNom = false; render(); window.scrollTo(0, 0); });
render();
})();
</script>
</body>
</html>
